name: Update README ecosystem table

on:
  schedule:
    # daily @ midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manually triggering the update'
        required: false
        default: 'Manual refresh of ecosystem table'
        type: string
  repository_dispatch:
    types: [update-ecosystem]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout .github repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README ecosystem table
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // grab all public repos
            const repos = await github.paginate(github.rest.repos.listForOrg, {
              org: 'Neobotics-Foundation-Inc',
              type: 'public',
              sort: 'updated',
              direction: 'desc'
            });
            
            // remove the .github repo and any archived repos
            const filteredRepos = repos.filter(repo => 
              !repo.archived && 
              repo.name !== '.github'
            ).sort((a, b) => a.name.localeCompare(b.name));
            
            // accounting for no public repositories found
            if (filteredRepos.length === 0) {
              console.log('No public repositories found');
              return;
            }
            
            // ---- badge styling: language + license are baked STATIC from the API data we
            // already have (repo.language / repo.license), so they render instantly with icons
            // and make zero per-view GitHub API calls. Only the volatile stats stay dynamic.
            // Similar languages share a hue (JS/TS = gold, C-family = purple, Python = blue);
            // distinct languages get distinct hues. Value = [color, simple-icons logo, logoColor].
            const LANG = {
              'JavaScript':       ['F7DF1E', 'javascript', 'black'],
              'TypeScript':       ['B8860B', 'typescript', 'white'],
              'CoffeeScript':     ['9C8A5A', 'coffeescript', 'white'],
              'Python':           ['3776AB', 'python', 'white'],
              'Jupyter Notebook': ['5B8DB8', 'jupyter', 'white'],
              'C':                ['3C2A7A', 'c', 'white'],
              'C++':              ['7A4FBF', 'cplusplus', 'white'],
              'C#':               ['512BD4', 'csharp', 'white'],
              'Java':             ['B07219', 'openjdk', 'white'],
              'Kotlin':           ['D2691E', 'kotlin', 'white'],
              'Go':               ['00ADD8', 'go', 'white'],
              'Rust':             ['CE422B', 'rust', 'white'],
              'Ruby':             ['CC342D', 'ruby', 'white'],
              'Swift':            ['F05138', 'swift', 'white'],
              'Shell':            ['4EAA25', 'gnubash', 'white'],
              'Dart':             ['0175C2', 'dart', 'white'],
              'PHP':              ['777BB4', 'php', 'white'],
              'HTML':             ['E34F26', 'html5', 'white'],
              'CSS':              ['1572B6', 'css3', 'white'],
            };
            // License families share a hue: GPL/copyleft = teal, CERN hardware = blue, permissive = green.
            const LIC = {
              'GPL-3.0': '2A9D8F', 'GPL-2.0': '1F7A6E', 'AGPL-3.0': '14635A', 'LGPL-3.0': '4DB6A6',
              'CERN-OHL-S-2.0': '0053A1', 'CERN-OHL-W-2.0': '2E73B8', 'CERN-OHL-P-2.0': '5B9BD5',
              'MIT': '3FA66A', 'BSD-2-Clause': '57B894', 'BSD-3-Clause': '2E8B57', 'Apache-2.0': '1E7A46',
            };
            const enc = s => String(s).replace(/-/g, '--').replace(/_/g, '__').replace(/ /g, '%20').replace(/#/g, '%23');
            // No programming language detected? GitHub reports null for hardware repos because it
            // tags KiCad/STEP/STL files as "data". When a repo has no detected code language we
            // classify it by name / topic / license:
            //   PCB (KiCad/Eagle, "*-pcb", electronics)         -> green "PCB" badge (#046307)
            //   mechanical CAD (CERN-OHL, 3D-printing, chassis) -> navy  "CAD" badge
            //   genuinely empty                                 -> dark-red "none" badge
            // electronics-specific vs mechanical-specific signals ('hardware' is generic -> neither)
            const PCB_NAME   = /(^|[-_])(pcb|pcba|kicad|eagle|circuit)([-_]|$)/i;
            const CAD_NAME   = /(^|[-_])(cad|chassis|enclosure|mechanical|3d)([-_]|$)/i;
            const PCB_TOPICS = ['pcb','pcba','kicad','eagle','altium','circuit','schematic','electronics'];
            const CAD_TOPICS = ['cad','mechanical','3d-printing','3d-printed','3d-model','enclosure','chassis','chassis-design'];
            const hasTopic = (repo, set) => (repo.topics || []).some(t => set.includes(t));
            // Returns 'pcb' | 'cad' | null for a repo with no detected code language.
            const hwClass = (repo) => {
              if (PCB_NAME.test(repo.name)) return 'pcb';
              if (CAD_NAME.test(repo.name)) return 'cad';
              const pcbT = hasTopic(repo, PCB_TOPICS), cadT = hasTopic(repo, CAD_TOPICS);
              if (pcbT && !cadT) return 'pcb';
              if (cadT && !pcbT) return 'cad';
              if (pcbT && cadT) return 'cad'; // both signals -> mechanical wins (a board is secondary to a chassis)
              const spdx = repo.license && repo.license.spdx_id;
              const generic = hasTopic(repo, ['hardware','open-hardware']) || (spdx && spdx.indexOf('CERN-OHL') === 0);
              return generic ? 'cad' : null; // generic open hardware defaults to CAD
            };
            const pcbBadge = (style) => `![PCB](https://img.shields.io/badge/PCB-046307?style=${style})`;
            const cadBadge = (style) => `![CAD](https://img.shields.io/badge/CAD-1B2036?style=${style})`;
            const langBadge = (repo, style) => {
              const lang = repo.language;
              if (lang) { // GitHub detected real code -> show the language
                const m = LANG[lang];
                if (m) return `![${lang}](https://img.shields.io/badge/${enc(lang)}-${m[0]}?style=${style}&logo=${m[1]}&logoColor=${m[2]})`;
                return `![${lang}](https://img.shields.io/badge/${enc(lang)}-6E7681?style=${style})`; // unmapped lang: grey
              }
              const hw = hwClass(repo);
              if (hw === 'pcb') return pcbBadge(style);
              if (hw === 'cad') return cadBadge(style);
              return `![Language](https://img.shields.io/badge/none-8B1E1E?style=${style})`; // empty: dark red
            };
            const licBadge = (spdx, style) => {
              if (!spdx || spdx === 'NOASSERTION') return `![License](https://img.shields.io/badge/none-9E9E9E?style=${style})`;
              return `![License](https://img.shields.io/badge/${enc(spdx)}-${LIC[spdx] || '6E7681'}?style=${style})`;
            };

            // generate table rows
            const tableRows = filteredRepos.map(repo => {
              const name = repo.name;
              // account for pipe characters in description by changing | to \|
              let description = repo.description || 'No description';
              description = description.replace(/\|/g, '\\|');
              // truncate to first 3 words and add ...
              const words = description.split(' ');
              if (words.length > 3) {
                description = words.slice(0, 3).join(' ') + '...';
              }
              
              // Language/License: static icon badges (no API call). Stats: dynamic with
              // cacheSeconds=86400 so shields serves from CDN cache ~daily instead of hitting
              // GitHub on every view (which triggered "Unable to select next GitHub token from pool").
              return `| [**${name}**](${repo.html_url})<br><em>${description}</em> | ${langBadge(repo, 'flat-square')} | ${licBadge(repo.license && repo.license.spdx_id, 'flat-square')} | ![Issues](https://img.shields.io/github/issues/Neobotics-Foundation-Inc/${name}?style=flat-square&label=&cacheSeconds=86400) | ![Last Commit](https://img.shields.io/github/last-commit/Neobotics-Foundation-Inc/${name}?style=flat-square&label=&cacheSeconds=86400) | ![Contributors](https://img.shields.io/github/contributors/Neobotics-Foundation-Inc/${name}?style=flat-square&label=&cacheSeconds=86400) |`;
            }).join('\n');
            
            // build the complete table
            const tableHeader = '| Repository | Language | License | Issues | Last Commit | Contrib. |\n|------------|:--------:|:-------:|:------:|:-----------:|:--------:|';
            
            const newTable = `${tableHeader}\n${tableRows}`;
            
            // read the current README
            const readmePath = 'profile/README.md';
            let readme = fs.readFileSync(readmePath, 'utf8');
            
            // replace the ecosystem table using regex
            // Match from the table header to the next ---
            const tableRegex = /\| Repository \| Language \| License \| Issues \| Last Commit \| Contrib\. \|[\s\S]*?\n\n---/;

            if (tableRegex.test(readme)) {
              readme = readme.replace(tableRegex, `${newTable}\n\n---`);
              console.log('Successfully replaced ecosystem table');
            } else {
              console.log('Could not find ecosystem table to replace. Make sure the README has the correct table header.');
              console.log('Expected header: | Repository | Language | License | Issues | Last Commit | Contrib. |');
              return;
            }
            
            // write the updated README
            fs.writeFileSync(readmePath, readme);
            
            console.log(`Updated ecosystem table with ${filteredRepos.length} repositories`);

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add profile/README.md
          git diff --staged --quiet || git commit -m "docs: auto-update ecosystem table [skip ci]"
          git push
